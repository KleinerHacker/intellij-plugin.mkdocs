group=org.pcsoft.intellij.plugin
version=1.0.0-SNAPSHOT
# Optional: compile/test against a local IDE installation instead of the downloaded SDK.
# Keep your machine-specific path OUT of this committed file — set it in ~/.gradle/gradle.properties,
# via -PlocalIdePath=… , or the env var LOCAL_IDE_PATH. Point at the IDE install root (lib/, plugins/, bin/).
# Example (do not commit a real value here):
# localIdePath=P:\\JetBrains\\ToolBox\\IntelliJ IDEA Ultimate
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2g
