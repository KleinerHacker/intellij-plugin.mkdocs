# yaml-language-server: $schema=./feature-flags.schema.json
#
# The entries of the `theme.features` sequence of the *Material for MkDocs* theme.
#
# Everything a feature needs to be offered, documented and validated hangs off its entry: the section it
# belongs to, its description, whether it needs an Insiders build, which other flags it depends on or clashes
# with, and which Markdown extensions it forces to be enabled.
#
# `conflictsWith` is declared on one side of a pair only — the symmetric closure is computed when this file is
# read, so a caller never has to know which side declared the pair.

# --- announce ------------------------------------------------------------------------------------------

# The announcement bar can be dismissed and stays dismissed.
- id: announce.dismiss
  group: ANNOUNCE
  descriptionKey: material.feature.announce.dismiss

# --- content -------------------------------------------------------------------------------------------

# An edit button linking the page into the repository.
- id: content.action.edit
  group: CONTENT
  descriptionKey: material.feature.content.action.edit

# A button showing the raw source of the page in the repository.
- id: content.action.view
  group: CONTENT
  descriptionKey: material.feature.content.action.view

# Numbered annotations attached to lines of a code block.
#
# Only pymdownx.superfences is forced: annotations inside code blocks render with it alone. attr_list and
# md_in_html are what annotations *outside* of code blocks additionally need, which is a choice of the author
# and must not be reported as a broken configuration.
- id: content.code.annotate
  group: CONTENT
  descriptionKey: material.feature.content.code.annotate
  requiredExtensions:
    - pymdownx.superfences

# A copy to clipboard button on every code block.
- id: content.code.copy
  group: CONTENT
  descriptionKey: material.feature.content.code.copy
  requiredExtensions:
    - pymdownx.highlight

# Line selection inside a code block.
- id: content.code.select
  group: CONTENT
  descriptionKey: material.feature.content.code.select
  requiredExtensions:
    - pymdownx.highlight

# Footnotes are shown as tooltips instead of jumping to the bottom.
- id: content.footnote.tooltips
  group: CONTENT
  descriptionKey: material.feature.content.footnote.tooltips
  requiredExtensions:
    - footnotes

# All content tabs of a page switch together.
- id: content.tabs.link
  group: CONTENT
  descriptionKey: material.feature.content.tabs.link
  requiredExtensions:
    - pymdownx.tabbed
    - pymdownx.superfences

# Titles and abbreviations are rendered as styled tooltips.
#
# The flag restyles the tooltips of links and abbreviations that are already there, so it forces no extension
# of its own; attr_list and abbr only widen what the author can attach a tooltip to.
- id: content.tooltips
  group: CONTENT
  descriptionKey: material.feature.content.tooltips

# --- header --------------------------------------------------------------------------------------------

# The header slides away while the reader scrolls down.
- id: header.autohide
  group: HEADER
  descriptionKey: material.feature.header.autohide

# --- navigation ----------------------------------------------------------------------------------------

# Every navigation section starts out expanded.
- id: navigation.expand
  group: NAVIGATION
  descriptionKey: material.feature.navigation.expand
  conflictsWith:
    - navigation.prune

# Previous and next links in the footer.
- id: navigation.footer
  group: NAVIGATION
  descriptionKey: material.feature.navigation.footer

# A section may carry a page of its own instead of a plain label.
- id: navigation.indexes
  group: NAVIGATION
  descriptionKey: material.feature.navigation.indexes
  conflictsWith:
    - toc.integrate

# Pages are exchanged by script instead of being loaded anew.
- id: navigation.instant
  group: NAVIGATION
  descriptionKey: material.feature.navigation.instant

# A link target is fetched as soon as the pointer touches it.
- id: navigation.instant.prefetch
  group: NAVIGATION
  descriptionKey: material.feature.navigation.instant.prefetch
  insiders: true
  requires:
    - navigation.instant

# A progress bar for instant loading that takes longer.
- id: navigation.instant.progress
  group: NAVIGATION
  descriptionKey: material.feature.navigation.instant.progress
  requires:
    - navigation.instant

# A breadcrumb trail above the page title.
- id: navigation.path
  group: NAVIGATION
  descriptionKey: material.feature.navigation.path

# Only the navigation around the current page is rendered.
- id: navigation.prune
  group: NAVIGATION
  descriptionKey: material.feature.navigation.prune

# Top level entries are rendered as groups instead of collapsible items.
- id: navigation.sections
  group: NAVIGATION
  descriptionKey: material.feature.navigation.sections

# The top level of the navigation becomes a tab bar below the header.
- id: navigation.tabs
  group: NAVIGATION
  descriptionKey: material.feature.navigation.tabs

# The tab bar stays visible while scrolling.
- id: navigation.tabs.sticky
  group: NAVIGATION
  descriptionKey: material.feature.navigation.tabs.sticky
  insiders: true
  requires:
    - navigation.tabs

# A back to top button appears after scrolling up.
- id: navigation.top
  group: NAVIGATION
  descriptionKey: material.feature.navigation.top

# The address bar follows the section the reader is currently in.
- id: navigation.tracking
  group: NAVIGATION
  descriptionKey: material.feature.navigation.tracking

# --- search --------------------------------------------------------------------------------------------

# The search terms are highlighted on the opened page.
- id: search.highlight
  group: SEARCH
  descriptionKey: material.feature.search.highlight

# A button copying a deep link to the current search.
- id: search.share
  group: SEARCH
  descriptionKey: material.feature.search.share

# The search field completes the word being typed.
- id: search.suggest
  group: SEARCH
  descriptionKey: material.feature.search.suggest

# --- toc -----------------------------------------------------------------------------------------------

# The table of contents scrolls along with the reading position.
- id: toc.follow
  group: TOC
  descriptionKey: material.feature.toc.follow

# The table of contents is folded into the navigation sidebar.
- id: toc.integrate
  group: TOC
  descriptionKey: material.feature.toc.integrate
  conflictsWith:
    - toc.follow
