material.extra.analytics.feedback.ratings.data=The value reported to the analytics provider when the button is used.
material.extra.analytics.feedback.ratings.note=The note shown after the reader has rated the page, often asking for details.
material.extra.consent=The cookie consent dialogue shown before analytics or other cookies are used.
material.extra.consent.title=The heading of the consent dialogue.
material.extra.consent.description=The text of the consent dialogue explaining what the cookies are used for.
material.extra.consent.cookies=The cookies the reader can consent to, as identifier and the name shown for it.
material.extra.consent.actions=The buttons of the consent dialogue, such as accept, reject and manage.
material.extra.generator=Whether the "Made with Material for MkDocs" notice is rendered in the footer.
material.extra.status=The status badges pages may carry, as identifier and the description shown for it.
