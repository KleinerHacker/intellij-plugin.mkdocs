# --- Material theme: feature groups -----------------------------------------------------------
material.featureGroup.navigation=Navigation
material.featureGroup.toc=Table of contents
material.featureGroup.search=Search
material.featureGroup.header=Header
material.featureGroup.content=Content
material.featureGroup.announce=Announcement bar
# --- Material theme: theme.features -----------------------------------------------------------
material.feature.announce.dismiss=Lets the reader dismiss the announcement bar; the choice is remembered in the browser.
material.feature.content.action.edit=Adds a button to every page that opens it for editing in the linked repository.
material.feature.content.action.view=Adds a button to every page that shows its Markdown source in the linked repository.
material.feature.content.code.annotate=Allows numbered annotations to be attached to lines of a code block.
material.feature.content.code.copy=Adds a button to every code block that copies its content to the clipboard.
material.feature.content.code.select=Lets the reader select individual lines of a code block.
material.feature.content.footnote.tooltips=Shows footnotes as tooltips instead of sending the reader to the bottom of the page.
material.feature.content.tabs.link=Switches all content tabs of a page together when the reader picks a label.
material.feature.content.tooltips=Renders link titles and abbreviations as styled tooltips.
material.feature.header.autohide=Hides the header while the reader scrolls down and shows it again on the way up.
material.feature.navigation.expand=Expands all collapsible navigation sections from the start.
material.feature.navigation.footer=Shows links to the previous and the next page in the footer.
material.feature.navigation.indexes=Attaches a page to a navigation section instead of rendering the section as a plain label.
material.feature.navigation.instant=Exchanges pages by script instead of loading them anew, which makes navigation feel instant.
material.feature.navigation.instant.prefetch=Fetches the target of a link as soon as the pointer touches it. Requires Insiders.
material.feature.navigation.instant.progress=Shows a progress bar when an instant page load takes longer than expected.
material.feature.navigation.path=Shows a breadcrumb trail with the position of the page above its title.
material.feature.navigation.prune=Renders only the navigation around the current page, which keeps very large sites small.
material.feature.navigation.sections=Renders the top level of the navigation as groups instead of collapsible items.
material.feature.navigation.tabs=Renders the top level of the navigation as a tab bar below the header.
material.feature.navigation.tabs.sticky=Keeps the navigation tab bar visible while the reader scrolls. Requires Insiders.
material.feature.navigation.top=Shows a back to top button once the reader scrolls up.
material.feature.navigation.tracking=Updates the address bar with the anchor of the section the reader is currently in.
material.feature.search.highlight=Highlights all occurrences of the search terms on the page that is opened from the results.
material.feature.search.share=Adds a button that copies a deep link to the current search query.
material.feature.search.suggest=Completes the word being typed in the search field with the most likely continuation.
material.feature.toc.follow=Scrolls the table of contents along so the current section always stays in view.
material.feature.toc.integrate=Folds the table of contents into the navigation sidebar instead of showing it on the right.
# --- Material theme: theme.palette.scheme -----------------------------------------------------
material.scheme.default=Light
material.scheme.slate=Dark
# --- Material theme: markdown_extensions ------------------------------------------------------
material.extension.admonition=Call-out blocks such as note, warning and tip, written as "!!! note".
material.extension.attr_list=Adds HTML attributes and CSS classes to Markdown elements with a trailing "{ ... }".
material.extension.md_in_html=Renders Markdown inside HTML blocks that carry a markdown="1" attribute.
material.extension.def_list=Definition lists, and the base the task list markup builds on.
material.extension.footnotes=Footnote references and the definitions they point to.
material.extension.tables=Tables written with pipes.
material.extension.toc=Builds the table of contents of a page and the anchor links next to its headings.
material.extension.pymdownx.superfences=Nested fenced blocks, custom fences and the diagram support of the theme.
material.extension.pymdownx.highlight=Highlights the syntax of code blocks while the site is built, using Pygments.
material.extension.pymdownx.inlinehilite=Highlights the syntax of inline code spans.
material.extension.pymdownx.snippets=Embeds the content of other files into a page.
material.extension.pymdownx.tabbed=Content tabs, which group alternatives such as several languages of one example.
material.extension.pymdownx.emoji=Emoji shorthands, and the icon shorthands the theme provides such as :material-check:.
material.extension.pymdownx.details=Turns call-out blocks into collapsible ones, written as "??? note".
material.extension.pymdownx.critic=The markup of Critic Markup for additions, deletions and comments.
material.extension.pymdownx.caret=Superscript with "^text^" and inserted text with "^^text^^".
material.extension.pymdownx.keys=Renders keyboard keys as key caps, written as "++ctrl+alt+del++".
material.extension.pymdownx.mark=Highlighted text, written as "==text==".
material.extension.pymdownx.tilde=Subscript with "~text~" and deleted text with "~~text~~".
material.extension.pymdownx.tasklist=Lists of check boxes, written as "- [x] done".
material.extension.pymdownx.smartsymbols=Replaces sequences such as (c), --> and 1/2 with their typographic symbols.
material.extension.pymdownx.arithmatex=Passes mathematical expressions through to MathJax or KaTeX for rendering.
