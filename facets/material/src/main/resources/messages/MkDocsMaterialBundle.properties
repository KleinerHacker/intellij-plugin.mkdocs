material.css.md-primary-fg-color=The primary colour of the site, used for the header and for active entries.
material.css.md-primary-fg-color--light=A lighter shade of the primary colour, used for secondary text on it.
material.css.md-primary-fg-color--dark=A darker shade of the primary colour, used for the announcement bar.
material.css.md-primary-bg-color=The colour of text and icons placed on the primary colour.
material.css.md-primary-bg-color--light=A dimmed variant of the text colour placed on the primary colour.
material.css.md-accent-fg-color=The accent colour of the site, used for hovered links and focused controls.
material.css.md-accent-fg-color--transparent=A translucent variant of the accent colour, used for hover backgrounds.
material.css.md-accent-bg-color=The colour of text and icons placed on the accent colour.
material.css.md-accent-bg-color--light=A dimmed variant of the text colour placed on the accent colour.
material.css.md-default-fg-color=The foreground colour of the page, used for body text.
material.css.md-default-fg-color--light=A dimmed foreground colour, used for secondary text.
material.css.md-default-fg-color--lighter=A further dimmed foreground colour, used for hints and disabled text.
material.css.md-default-fg-color--lightest=The faintest foreground colour, used for separators and outlines.
material.css.md-default-bg-color=The background colour of the page.
material.css.md-default-bg-color--light=A translucent variant of the page background, used for overlays.
material.css.md-default-bg-color--lighter=A more translucent variant of the page background.
material.css.md-default-bg-color--lightest=The most translucent variant of the page background.
material.css.md-code-fg-color=The foreground colour of code blocks and inline code.
material.css.md-code-bg-color=The background colour of code blocks and inline code.
material.css.md-code-hl-color=The background colour marking highlighted lines of a code block.
material.css.md-code-hl-number-color=The colour of numeric literals in highlighted code.
material.css.md-code-hl-special-color=The colour of special characters and escapes in highlighted code.
material.css.md-code-hl-function-color=The colour of function names in highlighted code.
material.css.md-code-hl-constant-color=The colour of constants in highlighted code.
material.css.md-code-hl-keyword-color=The colour of keywords in highlighted code.
material.css.md-code-hl-string-color=The colour of string literals in highlighted code.
material.css.md-code-hl-name-color=The colour of plain identifiers in highlighted code.
material.css.md-code-hl-operator-color=The colour of operators in highlighted code.
material.css.md-code-hl-punctuation-color=The colour of punctuation in highlighted code.
material.css.md-code-hl-comment-color=The colour of comments in highlighted code.
material.css.md-code-hl-generic-color=The colour of generic output such as diff context in highlighted code.
material.css.md-code-hl-variable-color=The colour of variables in highlighted code.
material.css.md-typeset-color=The base text colour of the rendered content.
material.css.md-typeset-a-color=The colour of links inside the rendered content.
material.css.md-typeset-mark-color=The background colour of text marked with "==text==".
material.css.md-typeset-del-color=The background colour of deleted text.
material.css.md-typeset-ins-color=The background colour of inserted text.
material.css.md-typeset-kbd-color=The background colour of a key cap.
material.css.md-typeset-kbd-accent-color=The colour of the highlight along the top edge of a key cap.
material.css.md-typeset-kbd-border-color=The colour of the bottom edge of a key cap, which gives it its depth.
material.css.md-typeset-table-color=The colour of the lines separating the rows of a table.
material.css.md-admonition-fg-color=The foreground colour of a call-out block.
material.css.md-admonition-bg-color=The background colour of a call-out block.
material.css.md-footer-fg-color=The foreground colour of the footer.
material.css.md-footer-fg-color--light=A dimmed foreground colour of the footer, used for secondary text.
material.css.md-footer-fg-color--lighter=The faintest foreground colour of the footer, used for the copyright notice.
material.css.md-footer-bg-color=The background colour of the footer.
material.css.md-footer-bg-color--dark=The background colour of the lower part of the footer, below the navigation links.
material.css.md-shadow-z1=The shadow of a slightly raised element, such as a card.
material.css.md-shadow-z2=The shadow of a raised element, such as the header or an open dialogue.
material.css.md-shadow-z3=The shadow of the most raised element, such as the search results overlay.
material.css.md-text-font=The font family used for body text; set by theme.font.text.
material.css.md-code-font=The font family used for code; set by theme.font.code.
