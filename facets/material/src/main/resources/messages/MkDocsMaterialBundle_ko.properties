# --- Material 테마: theme.features -----------------------------------------------------------
material.feature.announce.dismiss=독자가 공지 표시줄을 닫을 수 있게 하며, 선택은 브라우저에 기억됩니다.
material.feature.content.action.edit=모든 페이지에 연결된 저장소에서 편집을 여는 버튼을 추가합니다.
material.feature.content.action.view=모든 페이지에 연결된 저장소의 Markdown 원본을 보여 주는 버튼을 추가합니다.
material.feature.content.code.annotate=코드 블록의 줄에 번호가 매겨진 주석을 붙일 수 있게 합니다.
material.feature.content.code.copy=모든 코드 블록에 내용을 클립보드로 복사하는 버튼을 추가합니다.
material.feature.content.code.select=독자가 코드 블록의 개별 줄을 선택할 수 있게 합니다.
material.feature.content.footnote.tooltips=각주를 페이지 하단으로 이동하지 않고 툴팁으로 표시합니다.
material.feature.content.tabs.link=독자가 레이블을 선택하면 페이지의 모든 콘텐츠 탭이 함께 전환됩니다.
material.feature.content.tooltips=링크 제목과 약어를 스타일이 적용된 툴팁으로 렌더링합니다.
material.feature.header.autohide=독자가 아래로 스크롤하면 헤더를 숨기고 위로 올라갈 때 다시 표시합니다.
material.feature.navigation.expand=접을 수 있는 모든 내비게이션 섹션을 처음부터 펼칩니다.
material.feature.navigation.footer=푸터에 이전 페이지와 다음 페이지 링크를 표시합니다.
material.feature.navigation.indexes=섹션을 단순 레이블로 렌더링하지 않고 내비게이션 섹션에 페이지를 연결합니다.
material.feature.navigation.instant=페이지를 새로 불러오지 않고 스크립트로 교체하여 내비게이션을 즉각적으로 느끼게 합니다.
material.feature.navigation.instant.prefetch=포인터가 링크에 닿는 즉시 대상을 미리 가져옵니다. Insiders가 필요합니다.
material.feature.navigation.instant.progress=즉시 페이지 로딩이 예상보다 오래 걸리면 진행 표시줄을 보여 줍니다.
material.feature.navigation.path=페이지 제목 위에 현재 위치를 나타내는 이동 경로를 표시합니다.
material.feature.navigation.prune=현재 페이지 주변의 내비게이션만 렌더링하여 매우 큰 사이트도 가볍게 유지합니다.
material.feature.navigation.sections=내비게이션 최상위를 접을 수 있는 항목이 아니라 그룹으로 렌더링합니다.
material.feature.navigation.tabs=내비게이션 최상위를 헤더 아래의 탭 표시줄로 렌더링합니다.
material.feature.navigation.tabs.sticky=독자가 스크롤하는 동안 내비게이션 탭 표시줄을 계속 표시합니다. Insiders가 필요합니다.
material.feature.navigation.top=독자가 위로 스크롤하면 맨 위로 이동 버튼을 표시합니다.
material.feature.navigation.tracking=독자가 현재 보고 있는 섹션의 앵커로 주소 표시줄을 갱신합니다.
material.feature.search.highlight=검색 결과에서 연 페이지에서 검색어의 모든 일치 항목을 강조합니다.
material.feature.search.share=현재 검색어에 대한 딥 링크를 복사하는 버튼을 추가합니다.
material.feature.search.suggest=검색 필드에 입력 중인 단어를 가장 가능성 높은 형태로 완성합니다.
material.feature.toc.follow=현재 섹션이 항상 보이도록 목차를 함께 스크롤합니다.
material.feature.toc.integrate=목차를 오른쪽에 표시하지 않고 내비게이션 사이드바에 통합합니다.
# --- Material 테마: theme.palette.scheme -----------------------------------------------------
material.scheme.default=밝게
material.scheme.slate=어둡게
# --- Material 테마: markdown_extensions ------------------------------------------------------
material.extension.admonition="!!! note" 형식으로 작성하는 참고, 경고, 팁 등의 콜아웃 블록입니다.
material.extension.attr_list=뒤에 붙이는 "{ ... }"로 Markdown 요소에 HTML 속성과 CSS 클래스를 추가합니다.
material.extension.md_in_html=markdown="1" 속성이 있는 HTML 블록 안의 Markdown을 렌더링합니다.
material.extension.def_list=정의 목록이며, 작업 목록 마크업이 기반으로 삼는 확장입니다.
material.extension.footnotes=각주 참조와 그것이 가리키는 정의입니다.
material.extension.tables=파이프 문자로 작성하는 표입니다.
material.extension.toc=페이지의 목차와 제목 옆의 앵커 링크를 생성합니다.
material.extension.pymdownx.superfences=중첩된 코드 펜스, 사용자 지정 펜스, 테마의 다이어그램 지원입니다.
material.extension.pymdownx.highlight=사이트 빌드 시 Pygments로 코드 블록의 구문을 강조합니다.
material.extension.pymdownx.inlinehilite=인라인 코드의 구문을 강조합니다.
material.extension.pymdownx.snippets=다른 파일의 내용을 페이지에 삽입합니다.
material.extension.pymdownx.tabbed=한 예제의 여러 언어처럼 대안을 묶는 콘텐츠 탭입니다.
material.extension.pymdownx.emoji=이모지 축약어와 :material-check: 같은 테마 제공 아이콘 축약어입니다.
material.extension.pymdownx.details="??? note" 형식으로 작성하여 콜아웃 블록을 접을 수 있게 만듭니다.
material.extension.pymdownx.critic=추가, 삭제, 주석을 위한 Critic Markup 마크업입니다.
material.extension.pymdownx.caret="^text^"로 위 첨자를, "^^text^^"로 삽입된 텍스트를 표시합니다.
material.extension.pymdownx.keys="++ctrl+alt+del++" 형식으로 작성한 키를 키캡으로 렌더링합니다.
material.extension.pymdownx.mark="==text==" 형식으로 작성하는 강조 표시 텍스트입니다.
material.extension.pymdownx.tilde="~text~"로 아래 첨자를, "~~text~~"로 삭제된 텍스트를 표시합니다.
material.extension.pymdownx.tasklist="- [x] done" 형식으로 작성하는 체크박스 목록입니다.
material.extension.pymdownx.smartsymbols=(c), --> , 1/2 같은 시퀀스를 해당 조판 기호로 바꿉니다.
material.extension.pymdownx.arithmatex=수식을 MathJax 또는 KaTeX로 전달하여 렌더링합니다.
