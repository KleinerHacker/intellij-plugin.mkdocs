material.scheme.default=ライト
material.scheme.slate=ダーク
# --- Material テーマ: markdown_extensions ------------------------------------------------------
material.extension.admonition="!!! note" のように記述する、note、warning、tip などの注意書きブロック。
material.extension.attr_list=末尾の "{ ... }" によって、Markdown 要素に HTML 属性と CSS クラスを追加します。
material.extension.md_in_html=markdown="1" 属性を持つ HTML ブロック内の Markdown を描画します。
material.extension.def_list=定義リスト。タスクリスト記法の基盤にもなります。
material.extension.footnotes=脚注の参照と、その参照先となる定義。
material.extension.tables=パイプ記号で記述する表。
material.extension.toc=ページの目次と、見出しの横のアンカーリンクを生成します。
material.extension.pymdownx.superfences=入れ子のフェンスブロック、カスタムフェンス、テーマの図表サポート。
material.extension.pymdownx.highlight=サイトのビルド時に、Pygments を使ってコードブロックの構文を強調表示します。
material.extension.pymdownx.inlinehilite=インラインコードの構文を強調表示します。
material.extension.pymdownx.snippets=他のファイルの内容をページに埋め込みます。
material.extension.pymdownx.tabbed=1 つの例の複数言語版など、選択肢をまとめるコンテンツタブ。
material.extension.pymdownx.emoji=絵文字のショートハンドと、:material-check: などテーマが提供するアイコンのショートハンド。
material.extension.pymdownx.details="??? note" のように記述し、注意書きブロックを折りたたみ可能にします。
material.extension.pymdownx.critic=追加、削除、コメントのための Critic Markup の記法。
material.extension.pymdownx.caret="^text^" による上付き文字と、"^^text^^" による挿入テキスト。
material.extension.pymdownx.keys="++ctrl+alt+del++" のように記述し、キーボードのキーをキートップとして描画します。
material.extension.pymdownx.mark="==text==" のように記述する、強調表示されたテキスト。
material.extension.pymdownx.tilde="~text~" による下付き文字と、"~~text~~" による削除テキスト。
material.extension.pymdownx.tasklist="- [x] done" のように記述する、チェックボックスのリスト。
material.extension.pymdownx.smartsymbols=(c)、-->、1/2 などの並びを、対応する活字記号に置き換えます。
material.extension.pymdownx.arithmatex=数式を MathJax または KaTeX に渡して描画します。
