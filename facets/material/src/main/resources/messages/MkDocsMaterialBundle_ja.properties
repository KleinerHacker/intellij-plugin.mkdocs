# --- Material テーマ: theme.features -----------------------------------------------------------
material.feature.announce.dismiss=読者がお知らせバーを閉じられるようにします。選択はブラウザーに記憶されます。
material.feature.content.action.edit=リンクされたリポジトリでページを編集用に開くボタンを、各ページに追加します。
material.feature.content.action.view=リンクされたリポジトリでページの Markdown ソースを表示するボタンを、各ページに追加します。
material.feature.content.code.annotate=コードブロックの行に番号付きの注釈を付けられるようにします。
material.feature.content.code.copy=内容をクリップボードにコピーするボタンを、各コードブロックに追加します。
material.feature.content.code.select=読者がコードブロックの個々の行を選択できるようにします。
material.feature.content.footnote.tooltips=読者をページ下部へ移動させる代わりに、脚注をツールチップとして表示します。
material.feature.content.tabs.link=読者がラベルを選択したとき、ページ内のすべてのコンテンツタブを連動して切り替えます。
material.feature.content.tooltips=リンクのタイトルと略語を、スタイル付きのツールチップとして描画します。
material.feature.header.autohide=読者が下にスクロールする間はヘッダーを隠し、上に戻ると再び表示します。
material.feature.navigation.expand=折りたたみ可能なナビゲーションセクションを、最初からすべて展開します。
material.feature.navigation.footer=前のページと次のページへのリンクをフッターに表示します。
material.feature.navigation.indexes=ナビゲーションセクションを単なるラベルとして描画する代わりに、ページを割り当てます。
material.feature.navigation.instant=ページを読み込み直す代わりにスクリプトで差し替え、ナビゲーションを瞬時に感じさせます。
material.feature.navigation.instant.prefetch=ポインターがリンクに触れた時点で、リンク先を先読みします。Insiders が必要です。
material.feature.navigation.instant.progress=瞬時のページ読み込みに予想以上の時間がかかる場合、プログレスバーを表示します。
material.feature.navigation.path=ページのタイトルの上に、位置を示すパンくずリストを表示します。
material.feature.navigation.prune=現在のページ周辺のナビゲーションのみを描画し、非常に大きなサイトでも軽量に保ちます。
material.feature.navigation.sections=ナビゲーションの最上位を、折りたたみ可能な項目ではなくグループとして描画します。
material.feature.navigation.tabs=ナビゲーションの最上位を、ヘッダーの下のタブバーとして描画します。
material.feature.navigation.tabs.sticky=読者がスクロールしてもナビゲーションのタブバーを表示し続けます。Insiders が必要です。
material.feature.navigation.top=読者が上にスクロールすると、トップに戻るボタンを表示します。
material.feature.navigation.tracking=読者が現在いるセクションのアンカーで、アドレスバーを更新します。
material.feature.search.highlight=検索結果から開いたページ上で、検索語のすべての出現箇所を強調表示します。
material.feature.search.share=現在の検索クエリへのディープリンクをコピーするボタンを追加します。
material.feature.search.suggest=検索フィールドに入力中の語を、最も可能性の高い候補で補完します。
material.feature.toc.follow=現在のセクションが常に見えるよう、目次を追従してスクロールします。
material.feature.toc.integrate=目次を右側に表示する代わりに、ナビゲーションのサイドバーに統合します。
