[versions]
junit = "4.13.2"
jackson = "2.22.1"
kotlin = "2.4.10"
changelog = "2.5.0"
foojay-resolver = "1.0.0"
intellij-platform = "2.18.1"
idea = "2026.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
# Pinned to align transitive Kotlin artifacts (pulled via jackson-module-kotlin → kotlin-reflect) with the
# compiler + the platform-bundled stdlib. Prevents an older stdlib on the classpath from crashing the
# coroutine debug probes with "Debug metadata version mismatch" during platform tests.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
intellij-platform-settings = { id = "org.jetbrains.intellij.platform.settings", version.ref = "intellij-platform" }
