material.css.md-code-hl-punctuation-color=The colour of punctuation in highlighted code.
material.css.md-code-hl-comment-color=The colour of comments in highlighted code.
material.css.md-code-hl-generic-color=The colour of generic output such as diff context in highlighted code.
material.css.md-code-hl-variable-color=The colour of variables in highlighted code.
material.css.md-typeset-color=The base text colour of the rendered content.
material.css.md-typeset-a-color=The colour of links inside the rendered content.
material.css.md-typeset-mark-color=The background colour of text marked with "==text==".
material.css.md-typeset-del-color=The background colour of deleted text.
material.css.md-typeset-ins-color=The background colour of inserted text.
material.css.md-typeset-kbd-color=The background colour of a key cap.
material.css.md-typeset-kbd-accent-color=The colour of the highlight along the top edge of a key cap.
material.css.md-typeset-kbd-border-color=The colour of the bottom edge of a key cap, which gives it its depth.
material.css.md-typeset-table-color=The colour of the lines separating the rows of a table.
material.css.md-admonition-fg-color=The foreground colour of a call-out block.
material.css.md-admonition-bg-color=The background colour of a call-out block.
material.css.md-footer-fg-color=The foreground colour of the footer.
material.css.md-footer-fg-color--light=A dimmed foreground colour of the footer, used for secondary text.
