reference.problem.forbiddenCharacter=''{0}'' is not allowed in a file name. Rename the file and adjust the path.
reference.problem.controlCharacter=This path contains a control character. Remove it; no file system accepts one in a name.
reference.problem.emptySegment=There is no name between these two separators. Remove one of them.
reference.problem.trailingDotOrSpace=A name must not end in a dot or a space. Windows drops both silently, so the file is no longer found.
reference.problem.absolutePath=MkDocs reads this path relative to the site, so it must not start at the root of the file system.
reference.problem.driveLetter=MkDocs reads this path relative to the site, so it must not start with a drive letter.
reference.problem.parentEscape=This step leaves the directory the path is resolved against. MkDocs does not follow it out of the site.
reference.problem.backslashSeparator=Only Windows reads a backslash as a separator. Use a forward slash so the site builds everywhere.
reference.problem.reservedName=''{0}'' is a device name reserved by Windows. A file cannot be called that there.
reference.problem.nonAscii=''{0}'' leaves ASCII. The path survives a checkout only while every machine agrees on the encoding.
reference.problem.spaceInSegment=A space has to be escaped in every address pointing at this file. A hyphen keeps the addresses of the built site readable.
reference.problem.missingFile=Cannot resolve the file ''{0}''. MkDocs cannot build a site whose path points nowhere.
reference.problem.missingDirectory=Cannot resolve the directory ''{0}''. MkDocs cannot build a site whose path points nowhere.
reference.problem.tooLong=This path is long enough to run into the limits of a file system once the checkout directory is put in front of it.
