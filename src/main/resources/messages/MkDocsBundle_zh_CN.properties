# --- Material 主题: CSS 变量 --------------------------------------------------------------------
material.css.md-primary-fg-color=站点主色，用于页眉和活动条目。
material.css.md-primary-fg-color--light=主色的浅色变体，用于其上的次要文本。
material.css.md-primary-fg-color--dark=主色的深色变体，用于公告栏。
material.css.md-primary-bg-color=位于主色之上的文本和图标颜色。
material.css.md-primary-bg-color--light=位于主色之上的文本颜色的暗化变体。
material.css.md-accent-fg-color=站点强调色，用于悬停链接和获得焦点的控件。
material.css.md-accent-fg-color--transparent=强调色的半透明变体，用于悬停背景。
material.css.md-accent-bg-color=位于强调色之上的文本和图标颜色。
material.css.md-accent-bg-color--light=位于强调色之上的文本颜色的暗化变体。
material.css.md-default-fg-color=页面前景色，用于正文文本。
material.css.md-default-fg-color--light=暗化的前景色，用于次要文本。
material.css.md-default-fg-color--lighter=进一步暗化的前景色，用于提示和禁用文本。
material.css.md-default-fg-color--lightest=最淡的前景色，用于分隔线和轮廓。
material.css.md-default-bg-color=页面背景色。
material.css.md-default-bg-color--light=页面背景的半透明变体，用于浮层。
material.css.md-default-bg-color--lighter=页面背景透明度更高的变体。
material.css.md-default-bg-color--lightest=页面背景透明度最高的变体。
material.css.md-code-fg-color=代码块和行内代码的前景色。
material.css.md-code-bg-color=代码块和行内代码的背景色。
material.css.md-code-hl-color=标记代码块高亮行的背景色。
material.css.md-code-hl-number-color=高亮代码中数字字面量的颜色。
material.css.md-code-hl-special-color=高亮代码中特殊字符和转义序列的颜色。
material.css.md-code-hl-function-color=高亮代码中函数名的颜色。
material.css.md-code-hl-constant-color=高亮代码中常量的颜色。
material.css.md-code-hl-keyword-color=高亮代码中关键字的颜色。
material.css.md-code-hl-string-color=高亮代码中字符串字面量的颜色。
material.css.md-code-hl-name-color=高亮代码中普通标识符的颜色。
material.css.md-code-hl-operator-color=高亮代码中运算符的颜色。
material.css.md-code-hl-punctuation-color=高亮代码中标点符号的颜色。
material.css.md-code-hl-comment-color=高亮代码中注释的颜色。
material.css.md-code-hl-generic-color=高亮代码中通用输出（如差异上下文）的颜色。
material.css.md-code-hl-variable-color=高亮代码中变量的颜色。
material.css.md-typeset-color=渲染内容的基础文本颜色。
material.css.md-typeset-a-color=渲染内容中链接的颜色。
material.css.md-typeset-mark-color=使用 "==text==" 标记的文本的背景色。
material.css.md-typeset-del-color=删除文本的背景色。
material.css.md-typeset-ins-color=插入文本的背景色。
material.css.md-typeset-kbd-color=键帽的背景色。
material.css.md-typeset-kbd-accent-color=键帽上边缘高光的颜色。
material.css.md-typeset-kbd-border-color=键帽下边缘的颜色，赋予其立体感。
material.css.md-typeset-table-color=分隔表格行的线条颜色。
material.css.md-admonition-fg-color=提示块的前景色。
material.css.md-admonition-bg-color=提示块的背景色。
material.css.md-footer-fg-color=页脚的前景色。
material.css.md-footer-fg-color--light=页脚暗化的前景色，用于次要文本。
material.css.md-footer-fg-color--lighter=页脚最淡的前景色，用于版权声明。
material.css.md-footer-bg-color=页脚的背景色。
material.css.md-footer-bg-color--dark=页脚下半部分（导航链接下方）的背景色。
material.css.md-shadow-z1=轻微抬升元素（如卡片）的阴影。
material.css.md-shadow-z2=抬升元素（如页眉或打开的对话框）的阴影。
material.css.md-shadow-z3=抬升程度最高的元素（如搜索结果浮层）的阴影。
material.css.md-text-font=正文文本使用的字体族；由 theme.font.text 设置。
material.css.md-code-font=代码使用的字体族；由 theme.font.code 设置。
# --- Material 主题: extra 键 --------------------------------------------------------------------
material.extra.social=项目的账号，在页脚渲染为一排图标。
material.extra.social.icon=链接的图标，以图标简写给出，例如 fontawesome/brands/github。
material.extra.social.link=图标所链接到的地址。
material.extra.social.name=图标的工具提示；默认为该地址的主机名。
material.extra.analytics=主题接入的站点分析，以及反馈小组件。
material.extra.analytics.provider=要加载的分析提供方；主题内置支持 "google"。
material.extra.analytics.property=数据上报到的属性或衡量标识。
material.extra.analytics.feedback=询问读者该页面是否有帮助的小组件。
material.extra.analytics.feedback.title=显示在评价按钮上方的问题。
material.extra.analytics.feedback.ratings=读者可选择的答案。
material.extra.analytics.feedback.ratings.icon=评价按钮的图标，以图标简写给出。
material.extra.analytics.feedback.ratings.name=评价按钮的工具提示。
material.extra.analytics.feedback.ratings.data=使用该按钮时上报给分析提供方的值。
material.extra.analytics.feedback.ratings.note=读者评价页面后显示的说明，通常用于征询详细意见。
material.extra.consent=在使用分析或其他 Cookie 之前显示的 Cookie 同意对话框。
material.extra.consent.title=同意对话框的标题。
material.extra.consent.description=同意对话框中说明 Cookie 用途的文本。
material.extra.consent.cookies=读者可以同意的 Cookie，以标识和显示名称给出。
material.extra.consent.actions=同意对话框的按钮，例如接受、拒绝和管理。
material.extra.generator=是否在页脚渲染 "Made with Material for MkDocs" 声明。
material.extra.status=页面可携带的状态徽章，以标识和显示的描述给出。
