reference.problem.forbiddenCharacter=파일 이름에 ''{0}''을(를) 사용할 수 없습니다. 파일 이름을 바꾸고 경로를 조정하세요.
reference.problem.controlCharacter=이 경로에 제어 문자가 있습니다. 어떤 파일 시스템도 이름에 허용하지 않으므로 제거하세요.
reference.problem.emptySegment=두 구분 기호 사이에 이름이 없습니다. 하나를 제거하세요.
reference.problem.trailingDotOrSpace=이름은 마침표나 공백으로 끝날 수 없습니다. Windows는 둘 다 자동으로 제거하므로 파일을 찾을 수 없게 됩니다.
reference.problem.absolutePath=MkDocs는 이 경로를 사이트 기준 상대 경로로 읽으므로 파일 시스템 루트에서 시작할 수 없습니다.
reference.problem.driveLetter=MkDocs는 이 경로를 사이트 기준 상대 경로로 읽으므로 드라이브 문자로 시작할 수 없습니다.
reference.problem.parentEscape=이 단계는 경로가 해석되는 디렉터리를 벗어납니다. MkDocs는 사이트 밖으로 따라가지 않습니다.
reference.problem.backslashSeparator=역슬래시를 구분 기호로 읽는 것은 Windows뿐입니다. 어디서나 빌드되도록 슬래시를 사용하세요.
reference.problem.reservedName=''{0}''은(는) Windows에서 예약된 장치 이름입니다. 해당 환경에서는 파일 이름으로 쓸 수 없습니다.
reference.problem.nonAscii=''{0}''은(는) ASCII를 벗어납니다. 모든 컴퓨터의 인코딩이 일치할 때만 체크아웃 후에도 경로가 유지됩니다.
reference.problem.spaceInSegment=이 파일을 가리키는 모든 주소에서 공백은 이스케이프해야 합니다. 하이픈을 쓰면 빌드된 사이트의 주소를 읽기 쉽게 유지할 수 있습니다.
reference.problem.tooLong=이 경로는 체크아웃 디렉터리가 앞에 붙으면 파일 시스템의 길이 제한에 걸릴 만큼 깁니다.
