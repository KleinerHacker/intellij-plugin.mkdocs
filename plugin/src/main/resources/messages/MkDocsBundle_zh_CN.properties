reference.problem.forbiddenCharacter=文件名中不允许使用 ''{0}''。请重命名文件并调整路径。
reference.problem.controlCharacter=此路径包含控制字符。请将其删除；没有文件系统接受名称中包含控制字符。
reference.problem.emptySegment=这两个分隔符之间没有名称。请删除其中一个。
reference.problem.trailingDotOrSpace=名称不能以点或空格结尾。Windows 会静默删除它们，导致文件无法找到。
reference.problem.absolutePath=MkDocs 以相对于站点的方式解析此路径，因此不能从文件系统根目录开始。
reference.problem.driveLetter=MkDocs 以相对于站点的方式解析此路径，因此不能以驱动器盘符开头。
reference.problem.parentEscape=此步骤离开了路径解析所基于的目录。MkDocs 不会跟随其离开站点。
reference.problem.backslashSeparator=只有 Windows 将反斜杠视为分隔符。请使用正斜杠，以便站点在任何环境下都能构建。
reference.problem.reservedName=''{0}'' 是 Windows 保留的设备名称。在该系统上文件不能使用此名称。
reference.problem.nonAscii=''{0}'' 超出了 ASCII 范围。只有当所有机器使用相同编码时，该路径才能在签出后保持有效。
reference.problem.spaceInSegment=在指向此文件的每个地址中都必须对空格进行转义。使用连字符可让构建站点的地址保持可读。
reference.problem.missingFile=无法解析文件 ''{0}''。MkDocs 无法构建路径指向不存在目标的站点。
reference.problem.missingDirectory=无法解析目录 ''{0}''。MkDocs 无法构建路径指向不存在目标的站点。
reference.problem.tooLong=在前面加上签出目录后，此路径的长度足以触及文件系统的限制。
