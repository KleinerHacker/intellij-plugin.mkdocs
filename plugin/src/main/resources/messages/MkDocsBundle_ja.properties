create.site.hint=名前は、指定した場所の下にサイトが作成されるディレクトリ名でもあります。その下にドキュメントディレクトリが作成され、さらにその中にアセットディレクトリとスタイルシートディレクトリが作られます。出力ディレクトリは、周囲のモジュールのビルドシステムに従います。
create.site.info.hint=必須なのはサイト名だけです。空のままにした項目は設定ファイルに書き込まれません。
