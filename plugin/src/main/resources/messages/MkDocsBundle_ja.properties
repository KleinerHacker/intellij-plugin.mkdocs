create.site.copyright.hint=各ページのフッターに表示されます。空のままにすると、表記は書き込まれません。
create.site.features.empty=MkDocs の機能はインストールされていません。
create.site.features.empty.hint=Angular Material、I18N、Mike などの機能が利用可能になると、ここに表示されます。
