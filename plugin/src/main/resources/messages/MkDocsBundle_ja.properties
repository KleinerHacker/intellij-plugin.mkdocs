reference.problem.forbiddenCharacter=''{0}'' はファイル名に使用できません。ファイルの名前を変更し、パスを修正してください。
reference.problem.controlCharacter=このパスには制御文字が含まれています。名前に制御文字を受け付けるファイルシステムはないため、削除してください。
reference.problem.emptySegment=2 つの区切り文字の間に名前がありません。どちらか一方を削除してください。
reference.problem.trailingDotOrSpace=名前をドットまたはスペースで終えることはできません。Windows はどちらも黙って削除するため、ファイルが見つからなくなります。
reference.problem.absolutePath=MkDocs はこのパスをサイトからの相対パスとして解釈するため、ファイルシステムのルートから始めることはできません。
reference.problem.driveLetter=MkDocs はこのパスをサイトからの相対パスとして解釈するため、ドライブレターで始めることはできません。
reference.problem.parentEscape=この階層移動は、パスの解決基準となるディレクトリの外に出ます。MkDocs はサイトの外へは追従しません。
reference.problem.backslashSeparator=バックスラッシュを区切り文字として解釈するのは Windows だけです。どの環境でもビルドできるようスラッシュを使用してください。
reference.problem.reservedName=''{0}'' は Windows が予約しているデバイス名です。Windows ではこの名前のファイルを作成できません。
reference.problem.nonAscii=''{0}'' は ASCII の範囲外です。すべての環境でエンコーディングが一致している場合にのみ、チェックアウト後もこのパスは維持されます。
reference.problem.spaceInSegment=このファイルを指すすべてのアドレスで、スペースはエスケープが必要です。ハイフンを使うと、ビルドされたサイトのアドレスが読みやすく保たれます。
reference.problem.missingFile=ファイル ''{0}'' を解決できません。MkDocs は存在しない場所を指すパスがあるサイトをビルドできません。
reference.problem.missingDirectory=ディレクトリ ''{0}'' を解決できません。MkDocs は存在しない場所を指すパスがあるサイトをビルドできません。
reference.problem.tooLong=このパスは、チェックアウトディレクトリを前に付けるとファイルシステムの制限に達する長さです。
